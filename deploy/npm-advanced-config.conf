# À coller dans Nginx Proxy Manager > Hôte proxy gardeticket > ⚙ Configuration Nginx personnalisée
# Hôte proxy : http -> IP du serveur GardeTicket, port 80. SSL : Forcer SSL, HTTP/2, HSTS.
#
# Recommandé pour éviter que le navigateur garde un vieux sw.js en cache :
# dans l'onglet « Emplacements personnalisés » de NPM, ajouter une entrée :
#   - Location : /sw.js
#   - Schéma / Nom d'hôte / Port : http -> <IP_GARDETICKET> : 80
#   - Configuration Nginx personnalisée :
#       add_header Cache-Control "no-cache, no-store, must-revalidate" always;
#       add_header Pragma "no-cache" always;
#       add_header Expires "0" always;
#       add_header X-Content-Type-Options "nosniff" always;

# En-têtes de sécurité
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' data: blob:; object-src 'self' data: blob:; manifest-src 'self'; worker-src 'self';" always;

# Blocage de l'accès depuis un ordinateur (Desktop uniquement)
set $block_desktop 1;

if ($http_user_agent ~* "(Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile)") {
    set $block_desktop 0;
}

if ($http_user_agent ~* "Uptime-Kuma") {
    set $block_desktop 0;
}

error_page 403 @mobile_only;

location @mobile_only {
    root /data/403_gardeticket;   # copier deploy/403_gardeticket/index.html dans ~/npm/data/403_gardeticket/
    rewrite ^ /index.html break;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://blablalinux.be data:;" always;
}

if ($block_desktop = 1) {
    return 403;
}
